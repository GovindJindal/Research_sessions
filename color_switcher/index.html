<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>COLOUR SWITCHER</h1>

    <div>
        <button class="switch a" onclick="changeColor('red')">Red</button>
        <button class="switch b" onclick="changeColor('yellow')">Yellow</button>
        <button class="switch c" onclick="changeColor('green')">Green</button>
        <button class="switch d" onclick="changeColor('violet')">Violet</button>
        <button class="switch e" onclick="changeColor('blue')">Blue</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
